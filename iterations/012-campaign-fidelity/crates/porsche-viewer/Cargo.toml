[package]
name = "porsche-viewer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nfs-assets = { path = "../nfs-assets" }
nfs-formats = { path = "../nfs-formats" }
nfs-game = { path = "../nfs-game" }
wgpu = "=30.0.1"
glam = "0.30"
bytemuck = { version = "1.24", features = ["derive"] }

[dev-dependencies]
# Same version as wgpu's shader front end (shader_check.rs).
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "=0.30.13"
pollster = "0.4"
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Element", "console"] }
console_error_panic_hook = "0.1"
